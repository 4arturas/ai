<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>G6 Custom Node Example</title>
    <script src="https://gw.alipayobjects.com/os/antv/pkg/_antv.g6-3.1.0/build/g6.js"></script>
    <style>
        table {
            width: 100%;
            height: 80vh;
            border: 1px solid white;
        }
        #container {
            width: 800px;
            height: 800px;
            border: 1px solid lightgrey;
        }
    </style>
</head>
<body>
<table>
    <tr>
        <td colspan="3" style="height: 50%">&nbsp;</td>
    </tr>
    <tr>
        <td style="width: 50%"></td>
        <td><div id="container"></div></td>
        <td style="width: 50%"></td>
    </tr>
    <tr>
        <td colspan="3" style="height: 50%">&nbsp;</td>
    </tr>
</table>
<script>
    G6.registerNode('custom-node', {
        draw(cfg, group) {
            const { x, y, size, label } = cfg;

            const circle = group.addShape('circle', {
                attrs: {
                    x,
                    y,
                    r: size,
                    fill: '#1890FF',
                    stroke: '#000',
                    lineWidth: 2
                },
                name: 'circle-shape'
            });

            if (label) {
                group.addShape('text', {
                    attrs: {
                        x,
                        y: y + size / 2,
                        text: label,
                        fontSize: 14,
                        fill: '#000',
                        textAlign: 'center',
                        textBaseline: 'middle'
                    },
                    name: 'text-shape'
                });
            }

            return circle;
        }
    });

    const { Graph } = G6;

    const graph = new Graph({
        container: 'container',
        width: 800,
        height: 800,
        fitViewPadding: [20, 40, 50, 20],
        modes: {
            default: ['drag-canvas', 'zoom-canvas', 'drag-node']
        },
        plugins: [{ type: 'grid-line', follow: true }],
        transform: ['process-parallel-edges', 'place-radial-labels']
    });

    const data = {
        nodes: [
            { id: 'node-1', x: 200, y: 200, size: 50, label: 'Node 1', type: 'custom-node' },
            { id: 'node-2', x: 400, y: 400, size: 70, label: 'Node 2', type: 'custom-node' }
        ],
        edges: [
            { source: 'node-1', target: 'node-2' }
        ]
    };

    graph.data(data);
    graph.render();

    graph.fitView();
</script>
</body>
</html>
