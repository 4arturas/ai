<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Graph Traversal Visualization</title>
    <script src="https://unpkg.com/@antv/g6@5/dist/g6.min.js"></script>

    <style>
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid black;
            width: 100%;
            height: 1000px;
        }
    </style>
</head>
<body>

<table style="width: 100%; height: 100%">
    <tbody>
        <tr>
            <td style="width: 50%">
                <div id="container"></div>
            </td>
            <td style="width: 50%">
                <canvas id="somCanvas" width="500" height="500"></canvas>
            </td>
        </tr>
    </tbody>
</table>


<script>
    const GRID_SIZE = 20;
    const som = {};
    function initSOM()
    {
        som.nodes = [];
        for ( let y = 0; y < GRID_SIZE; y++ )
        {
            som.nodes[y] = [];
            for ( let x = 0; x < GRID_SIZE; x++ )
            {
                som.nodes[y][x] = {
                    x,y,
                    weights: Array.from({length:3}, () => Math.random() )
                }
            } // end for x
        } // end for y
    }
</script>

<script>
    function createNode(id, x = 0, y = 0, label = "label", processValue = function() { alert("Not implemented node function!" ); } )
    {
        return {
            id, x, y, label, processValue,
            "style": {
                "badge": true,
                "badges": [
                    { "text": "A", "placement": "right-top" },
                    { "text": "Important", "placement": "right" },
                    { "text": "Notice", "placement": "right-bottom" }
                ],
                "badgePalette": ["#7E92B5", "#F4664A", "#FFBE3A"],
                "badgeFontSize": 7,

                "port": true,
                "ports": [
                    { "key": "top", "placement": "top", "fill": "#7E92B5" },
                    { "key": "right", "placement": "right", "fill": "#F4664A" },
                    { "key": "bottom", "placement": "bottom", "fill": "#FFBE3A" },
                    { "key": "left", "placement": [0, 0.5], "fill": "#D580FF" }
                ],
                "portR": 3,
                "portLineWidth": 1,
                "portStroke": "#fff"
            }
        };
    }

    function createEdge(source, target, condition = function() { return null; } )
    {
        return {
            id: `${source.id}-${target.id}`,
            source: source.id,
            target: target.id,
            condition,
            // type: 'line',
            //hape: 'cubic',
            style: {
                label: true,
                labelText: "test",
                // fill: 'red',
            },
        };
    }
</script>
<script>
    const node1 = createNode( "initSOM", 100, 200 );
    node1.processValue = initSOM;

    const node2 = createNode( "node2", 200, 200 );
    node2.processValue = function(v) {
        return v+1;
    }
    const node3 = createNode( "node3", 300, 200 );
    node3.processValue = function(v) {
        return v+2;
    }
    const node4 = createNode( "node4", 300, 300 );
    node4.processValue = function(v) {
        return v+3;
    }
</script>
<script>
    const edge1 = createEdge( node1, node2 );
    const edge2 = createEdge( node2, node3 );
    const edge3 = createEdge( node2, node4 );
    const edge4 = createEdge( node4, node2 );
</script>
<script>
    const data = {
        nodes: [
            node1, node2, node3, node4,
        ],
        edges: [
            edge1, edge2, edge3,
            edge4,
        ],
        // combos: [{ id: 'combo-1', type: 'circle' }],
    };

    const graph = new G6.Graph({
        container: 'container',
        // autoFit: 'view',
        // width: 100,
        // height: 100,
/*        animation: {
            duration: 1500,
        },*/
        data,
        node: {
            // size: 100,
            type: 'html',
            // type: 'circle',
            // type: 'star',
            // type: 'triangle',
            // type: 'diamond',
            // type: 'rect',
            style: {
                // fill: '#DEE9FF',
                // stroke: '#5B8FF9',
                // lineWidth: 2,
            },
            palette: {
                // field: 'group',
                // color: 'tableau',
            },
        },
        edge: {
            type: 'line',
            // type: 'cubic',
            // type: 'arc',
            // type: 'quadratic',
            // type: 'cubic-vertical',
            // type: 'cubic-horizontal',
            // type: 'cubic-radical',
            style: {
                stroke: '#aaa',
                // lineWidth: 2,
                endArrow: true
            },
        },
        layout: {
            // type: 'd3-force',
            type: 'force',
            // gravity: 10,
            x: {},
            y: {},
        },
        behaviors: ['drag-canvas', 'zoom-canvas', 'drag-element'],

        plugins: [{ type: 'grid-line', follow: true }]

    });

    graph.render();
</script>

<script>
    let result = 1;

    let edge = data.edges[0];
    let sourceNode = data.nodes.find(node => node.id === edge.source);
    while ( edge )
    {
        console.log( edge );
        sourceNode.processValue();
        sourceNode = data.nodes.find(node => node.id === edge.target);
        if ( !sourceNode )
            break;
        edge = sourceNode;
    } // end while


    for (let i = 0; i < data.edges.length; i++) {
        const edge = data.edges[i];
        const sourceNode = data.nodes.find(node => node.id === edge.source);
        const targetNode = data.nodes.find(node => node.id === edge.target);

        const sourceResult = sourceNode.processValue(result);
        result = targetNode.processValue(sourceResult);

        graph.updateEdgeData([{
            id: edge.id,
            style: { labelText: `${result}`,lineWidth: 2 }
        }]);

        graph.updateNodeData([{
            id: sourceNode.id,
            style: setNodeStyle(sourceResult)
        }]);


        graph.updateNodeData([{
            id: targetNode.id,
            style: setNodeStyle(result)
        }]);
        // console.log(`Edge ${i}:`, sourceNode, targetNode, result);
    }
    graph.render();

    function setNodeStyle(text)
    {
        return {
            // iconFontFamily: 'iconfont', // Corresponds to the `font-family` value in iconfont.css
            // iconText: '\ue7f1', // Corresponds to the `content` value in iconfont.css, make sure to add `u`
            // iconFill: '#7863FF',
            innerHTML: `<div style='width: 100%; height: 100%; border-radius: 20%; border: 1px solid red; display: flex; background-color: ghostwhite; justify-content: center; align-items: center;'>${text}</div>`,
            // dx: 10,
            // dy: 100,
            size: 50,
            label: true,
            labelText: `${text}`,
            // labelWordWrap: true,
            // labelWordWrapWidth: 50,
            badges: [
                { text: `${text}`, placement: 'right-top' },
                { text: 'Important', placement: 'right' },
                { text: 'Notice', placement: 'right-bottom' },
            ],
        };
    }

</script>

</body>
</html>
