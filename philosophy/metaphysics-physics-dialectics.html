            en: "A mathematical description of consistent behavior in nature (e.g., Newton's laws, relativity, quantum mechanics).",
            ru: "Математическое описание согласованного поведения в природе (например, законы Ньютона, теория относительности, квантовая механика).",
            lt: "Matematinis gamtos nuoseklaus elgsenos aprašymas (pvz., Niutono dėsniai, reliatyvumo teorija, kvantinė mechanika).",
        }
    };

    const dialectics = {
        thesis: {
            en: "An initial proposition or idea that starts the dialectical process.",
            ru: "Исходное предложение или идея, которая запускает диалектический процесс.",
            lt: "Pradinis teiginys ar idėja, inicijuojanti dialektinį procesą."
        },
        antithesis: {
            en: "Opposition or negation of the initial idea, creating tension or contradiction.",
            ru: "Противоположная или отрицающая идея, создающая напряжение или противоречие.",
            lt: "Priešinga ar neigianti idėja, sukurianti įtampą ar prieštaravimą."
        },
        synthesis: {
            en: "Resolution of contradiction by integrating thesis and antithesis into a higher-level idea.",
            ru: "Разрешение противоречия путем интеграции тезиса и антитезиса в более высокую идею.",
            lt: "Prieštaravimo išsprendimas integruojant tezę ir antitezę į aukštesnio lygio idėją."
        },
        contradiction: {
            en: "The core of dialectical development — the dynamic tension between opposites.",
            ru: "Основа диалектического развития — динамическое напряжение между противоположностями.",
            lt: "Pagrindinė dialektinio vystymosi dalis – dinaminė įtampa tarp priešingybių."
        },
        development: {
            en: "Progress through contradiction and synthesis, not linear progression.",
            ru: "Развитие через противоречие и синтез, а не линейное движение.",
            lt: "Vystymasis per prieštaravimus ir sintezę, o ne tiesioginis judėjimas."
        },
        unity: {
            en: "The unity of opposites — a key principle in dialectical logic.",
            ru: "Единство противоположностей — ключевой принцип диалектической логики.",
            lt: "Priešingybių vienybė – pagrindinis dialektinės logikos principas."
        },
        transformation: {
            en: "Internal change driven by internal contradictions and their resolution.",
            ru: "Внутреннее изменение, вызванное внутренними противоречиями и их разрешением.",
            lt: "Vidinis pokytis, sukeltas vidinių prieštaravimų ir jų išsprendimo."
        }
    };

    function App() {
        const [language, setLanguage] = React.useState('en');
        const [isModalVisible, setIsModalVisible] = React.useState(false);
        const [modalContent, setModalContent] = React.useState('');
        const [modalTitle, setModalTitle] = React.useState('');

        const showModal = (key, type) => {
            setModalTitle(propertyTranslations[language][key]);
            setModalContent(translations[language][type][key]);
            setIsModalVisible(true);
        };

        const handleOk = () => setIsModalVisible(false);
        const handleCancel = () => setIsModalVisible(false);

        const objectToTableData = (obj, type) =>
            Object.keys(obj).map((key) => ({
                key,
                property: propertyTranslations[language][key],
                description: obj[key][language],
                infoAction: (
                    <Button onClick={() => showModal(key, 'essays')}>
                        {translations[language].info}
                    </Button>
                ),
                exampleAction: (
                    <Button onClick={() => showModal(key, 'examples')}>
                        {translations[language].example}
                    </Button>
                )
            }));

        const columns = [
            {
                title: translations[language].property,
                dataIndex: 'property',
                key: 'property',
            },
            {
                title: translations[language].description,
                dataIndex: 'description',
                key: 'description',
            },
            {
                title: translations[language].info,
                dataIndex: 'infoAction',
                key: 'action',
            },
            {
                title: translations[language].example,
                dataIndex: 'exampleAction',
                key: 'example',
            }
        ];

        return (
            <div style={{ padding: 24 }}>
                <div style={{ marginBottom: 16 }}>
            <span style={{ fontWeight: 'bold', fontSize: '1.2em' }}>
              {translations[language].title}
            </span>
                    <div style={{ marginTop: 8 }}>
                        <Button className="lang-button" onClick={() => setLanguage('en')}>English</Button>
                        <Button className="lang-button" onClick={() => setLanguage('ru')}>Русский</Button>
                        <Button className="lang-button" onClick={() => setLanguage('lt')}>Lietuvių</Button>
                    </div>
                </div>

                <Tabs
                    defaultActiveKey="1"
                    items={[
                        {
                            label: translations[language].metaphysics,
                            key: '1',
                            children: (
                                <Table
                                    dataSource={objectToTableData(metaphysics, 'essays')}
                                    columns={columns}
                                    pagination={false}
                                    size="middle"
                                />
                            ),
                        },
                        {
                            label: translations[language].physics,
                            key: '2',
                            children: (
                                <Table
                                    dataSource={objectToTableData(physics, 'essays')}
                                    columns={columns}
                                    pagination={false}
                                    size="middle"
                                />
                            ),
                        },
                        {
                            label: translations[language].dialectics,
                            key: '3',
                            children: (
                                <Table
                                    dataSource={objectToTableData(dialectics, 'essays')}
                                    columns={columns}
                                    pagination={false}
                                    size="middle"
                                />
                            ),
                        },
                    ]}
                />

                <Modal
                    title={modalTitle}
                    open={isModalVisible}
                    onOk={handleOk}
                    onCancel={handleCancel}
                    footer={[
                        <Button key="ok" onClick={handleOk}>OK</Button>
                    ]}
                >
                    <div className="essay-modal">
                        <p>{modalContent}</p>
                    </div>
                </Modal>
            </div>
        );
    }

    const { createRoot } = ReactDOM;
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
