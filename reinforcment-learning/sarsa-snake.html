<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game with SARSA</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
        }
        canvas {
            border: 2px solid #333;
            background-color: #fff;
            margin-bottom: 20px;
        }
        .controls {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            margin: 0 10px;
        }
        button:hover {
            background-color: #eee;
        }
        #q-table-container {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #fff;
        }
        #q-table {
            border-collapse: collapse;
            width: 100%;
        }
        #q-table th, #q-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        #q-table th {
            background-color: #f2f2f2;
        }
        .highlight {
            background-color: yellow;
        }
    </style>
</head>
<body>
<h1>Snake Game with SARSA</h1>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<div class="controls">
    <button id="trainButton">Train Agent</button>
    <button id="runButton">Run Learned Policy</button>
</div>
<div id="training-progress" style="margin-bottom: 20px;"></div>
<div id="q-table-container">
    <h2>Q-Table</h2>
    <table id="q-table"></table>
</div>

<script>
    const gridSize = 10;
    const tileSize = 400 / gridSize;
    const actions = 4;
    const states = 3 * 3 * 2 * 2 * 2 * 2;
    let qTable = Array(states).fill(0).map(() => Array(actions).fill(0));
    let snake = [{ x: 5, y: 5 }];
    let food = { x: 8, y: 8 };
    let direction = 1;
    let score = 0;
    const learningRate = 0.2;
    const discountFactor = 0.95;
    let epsilon = 1.0;
    const epsilonDecay = 0.995;
    const minEpsilon = 0.05;
    const trainingEpisodes = 10000;

    function getState() {
        const head = snake[0];
        const foodRelX = food.x < head.x ? -1 : food.x > head.x ? 1 : 0;
        const foodRelY = food.y < head.y ? -1 : food.y > head.y ? 1 : 0;
        const obstacleUp = head.y === 0 || snake.some(s => s.x === head.x && s.y === head.y - 1) ? 1 : 0;
        const obstacleRight = head.x === gridSize - 1 || snake.some(s => s.x === head.x + 1 && s.y === head.y) ? 1 : 0;
        const obstacleDown = head.y === gridSize - 1 || snake.some(s => s.x === head.x && s.y === head.y + 1) ? 1 : 0;
        const obstacleLeft = head.x === 0 || snake.some(s => s.x === head.x - 1 && s.y === head.y) ? 1 : 0;
        return ((foodRelX + 1) * 3 + (foodRelY + 1)) * 16 +
            obstacleUp * 8 + obstacleRight * 4 + obstacleDown * 2 + obstacleLeft;
    }

    function resetGame() {
        snake = [{ x: 5, y: 5 }];
        food = { x: 8, y: 8 };
        direction = 1;
        score = 0;
    }

    function placeFood() {
        let newFood;
        do {
            newFood = {
                x: Math.floor(Math.random() * gridSize),
                y: Math.floor(Math.random() * gridSize)
            };
        } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
        food = newFood;
    }

    function chooseAction(state) {
        const forbiddenAction = direction === 0 ? 2 : direction === 2 ? 0 : direction === 1 ? 3 : direction === 3 ? 1 : -1;
        const validActions = [];
        for (let i = 0; i < actions; i++) {
            if (i !== forbiddenAction) validActions.push(i);
        }
        if (Math.random() < epsilon) {
            return validActions[Math.floor(Math.random() * validActions.length)];
        } else {
            let maxQ = -Infinity;
            let bestActions = [];
            for (let i of validActions) {
                if (qTable[state][i] > maxQ) {
                    maxQ = qTable[state][i];
                    bestActions = [i];
                } else if (qTable[state][i] === maxQ) {
                    bestActions.push(i);
                }
            }
            return bestActions[Math.floor(Math.random() * bestActions.length)];
        }
    }

    function takeAction(action) {
        const head = { ...snake[0] };
        const prevDirection = direction;
        direction = action;
        if (action === 0) head.y--;
        if (action === 1) head.x++;
        if (action === 2) head.y++;
        if (action === 3) head.x--;
        if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize ||
            snake.some(segment => segment.x === head.x && segment.y === head.y)) {
            return { reward: -10, done: true };
        }
        snake.unshift(head);
        const prevDist = Math.abs(snake[1].x - food.x) + Math.abs(snake[1].y - food.y);
        const newDist = Math.abs(head.x - food.x) + Math.abs(head.y - food.y);
        let reward = newDist < prevDist ? 0.5 : -0.5;
        if (head.x === food.x && head.y === food.y) {
            score++;
            placeFood();
            return { reward: 20, done: false };
        } else {
            snake.pop();
            return { reward: reward - 0.1, done: false };
        }
    }

    function train() {
        for (let i = 0; i < trainingEpisodes; i++) {
            resetGame();
            let done = false;
            let state = getState();
            let action = chooseAction(state);
            while (!done) {
                const { reward, done: newDone } = takeAction(action);
                const newState = getState();
                const nextAction = chooseAction(newState);
                const oldQValue = qTable[state][action];
                const nextQValue = newDone ? 0 : qTable[newState][nextAction];
                const newQ = oldQValue + learningRate * (reward + discountFactor * nextQValue - oldQValue);
                qTable[state][action] = newQ;
                state = newState;
                action = nextAction;
                done = newDone;
            }
            epsilon = Math.max(minEpsilon, epsilon * epsilonDecay);
            document.getElementById('training-progress').innerText = `Training Episode: ${i + 1}/${trainingEpisodes}, Score: ${score}`;
        }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const trainButton = document.getElementById('trainButton');
    const runButton = document.getElementById('runButton');
    const qTableElement = document.getElementById('q-table');

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'gray';
        for (let x = 0; x < gridSize; x++) {
            for (let y = 0; y < gridSize; y++) {
                ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
            }
        }
        ctx.strokeStyle = 'green';
        ctx.lineWidth = 5;
        ctx.beginPath();
        snake.forEach((segment, index) => {
            const x = segment.x * tileSize + tileSize / 2;
            const y = segment.y * tileSize + tileSize / 2;
            if (index === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        });
        ctx.stroke();
        ctx.fillStyle = 'red';
        ctx.fillRect(food.x * tileSize, food.y * tileSize, tileSize, tileSize);
        ctx.fillStyle = 'black';
        ctx.font = '20px Arial';
        ctx.fillText(`Score: ${score}`, 10, 20);
    }

    function updateQTableDisplay(currentState = -1) {
        let html = '<thead><tr><th>State</th><th>Up</th><th>Right</th><th>Down</th><th>Left</th></tr></thead><tbody>';
        for (let i = 0; i < states; i++) {
            const highlightClass = (i === currentState) ? ' class="highlight"' : '';
            html += `<tr${highlightClass}><td>${i}</td>`;
            for (let j = 0; j < actions; j++) {
                html += `<td>${qTable[i][j].toFixed(2)}</td>`;
            }
            html += '</tr>';
        }
        html += '</tbody>';
        qTableElement.innerHTML = html;
    }

    function runPolicy() {
        resetGame();
        draw();
        let done = false;
        const interval = setInterval(() => {
            const state = getState();
            updateQTableDisplay(state);
            if (done) {
                clearInterval(interval);
                alert(`Game Over! Final Score: ${score}`);
                resetGame();
                draw();
                updateQTableDisplay();
                return;
            }
            const forbiddenAction = direction === 0 ? 2 : direction === 2 ? 0 : direction === 1 ? 3 : direction === 3 ? 1 : -1;
            const validActions = [];
            for (let i = 0; i < actions; i++) {
                if (i !== forbiddenAction)
                    validActions.push(i);
            }
            let maxQ = -Infinity;
            let bestActions = [];
            for (let i of validActions) {
                if (qTable[state][i] > maxQ) {
                    maxQ = qTable[state][i];
                    bestActions = [i];
                } else if (qTable[state][i] === maxQ) {
                    bestActions.push(i);
                }
            }
            const action = bestActions[Math.floor(Math.random() * bestActions.length)];
            const { done: newDone } = takeAction(action);
            done = newDone;
            draw();
        }, 100);
    }

    trainButton.onclick = function() {
        train();
        alert('Training complete!');
        updateQTableDisplay();
        draw();
    };
    runButton.addEventListener('click', runPolicy);
    draw();
    updateQTableDisplay();
</script>
</body>
</html>
