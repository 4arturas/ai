<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>React + Ant Design – full-screen tabs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="https://unpkg.com/antd@6.4.4/dist/antd.css" />
    <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
    <style>body{padding:30px}</style>
</head>
<body>
<div id="root"></div>

<script type="module">
    import React from "https://esm.sh/react@19?dev";
    import { createRoot } from "https://esm.sh/react-dom@19/client?dev";
    import { Button, Tabs } from "https://esm.sh/antd@6.4.4?dev&bundle";

    globalThis.React = React;
    globalThis.ReactDOM = { createRoot };
    globalThis.antd = { Button, Tabs };
</script>

<script type="text/babel">
    const { createContext, useContext, useState } = React;
    const { Button, Tabs } = antd;

    const AppContext = createContext({});

    function Counter() {
        const { globalCount, setGlobalCount } = useContext(AppContext);

        return (
            <div style={{ padding: 20 }}>
                <h2>Counter Component</h2>
                <p>Global count: <strong>{globalCount}</strong></p>
                <Button type="primary" onClick={() => setGlobalCount(c => c + 1)} style={{ marginRight: 8 }}>+</Button>
                <Button type="default" onClick={() => setGlobalCount(c => c - 1)} style={{ marginRight: 8 }}>−</Button>
                <Button type="dashed" onClick={() => setGlobalCount(0)}>Reset</Button>
            </div>
        );
    }

    function App() {
        const [activeTabKey, setActiveTabKey] = useState("2");
        const [globalCount, setGlobalCount] = useState(0);

        const tabItems = [
            { key: "1", label: "Hello Tab 1", children: <div>Hello 2 {globalCount}</div> },
            { key: "2", label: "Counter", children: <Counter/> },
        ];

        return (
            <AppContext.Provider value={{ globalCount, setGlobalCount }}>
                <Tabs activeKey={activeTabKey} items={tabItems} onChange={setActiveTabKey} />
            </AppContext.Provider>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
