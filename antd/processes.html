<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallel Process Visualization</title>
    <link rel="stylesheet" href="https://unpkg.com/antd@6.4.4/dist/antd.css" />
    <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scroll-container {
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
        }
        .ant-table-wrapper .ant-table-cell {
            padding: 2px 4px !important;
            height: 24px !important;
        }
        .ant-table-wrapper .ant-table-tbody > tr > td {
            height: 24px !important;
        }
        .narrow-row {
            height: 24px !important;
        }
        .timeline-container {
            height: 16px !important;
        }
        .timeline-bar {
            height: 10px !important;
            top: 3px !important;
        }
        .process-name {
            cursor: pointer;
            color: #1890ff;
        }
        .process-name:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="module">
    import React from "https://esm.sh/react@19?dev";
    import { createRoot } from "https://esm.sh/react-dom@19/client?dev";
    import { Modal, Table, Tooltip } from "https://esm.sh/antd@6.4.4?dev&bundle";
    import dayjs from "https://esm.sh/dayjs@1?dev";

    globalThis.React = React;
    globalThis.ReactDOM = { createRoot };
    globalThis.antd = { Modal, Table, Tooltip };
    globalThis.dayjs = dayjs;
</script>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { Modal, Tooltip, Table } = antd;

    function App() {
        const scrollContainerRef = useRef(null);
        const PROCESS_TYPE_LOAD_FILES = 0;
        const PROCESS_TYPE_MAKE_PAYMENTS = 1;

        const baseTime = dayjs();

        let processes = [
            {
                type: PROCESS_TYPE_LOAD_FILES,
                name: "Load Two Files",
                description: "Loads two files for user1",
                start: 0,
                duration: 3000,
                task: { user: "user1", files: ["file1.xml", "file2.xml"] }
            },
            {
                type: PROCESS_TYPE_MAKE_PAYMENTS,
                name: "Make Two Payments",
                description: "Processes two payment transactions",
                start: 500,
                duration: 1000,
                task: { user: "user1", payments: [{ accountFrom: "accountA", accountTo: "accountB", amount: 0.01 }] }
            },
            {
                type: PROCESS_TYPE_LOAD_FILES,
                name: "Load Two files",
                description: "Load two files",
                start: 200,
                duration: 2500,
                task: { user: "user2", files: ["data1.xml", "data2.xml"] }
            },
            {
                type: PROCESS_TYPE_MAKE_PAYMENTS,
                name: "Process Refund",
                description: "Handles refund transactions for user3",
                start: 1500,
                duration: 2000,
                task: { user: "user3", payments: [{ accountFrom: "accountC", accountTo: "accountD", amount: 0.05 }] }
            },
            {
                type: PROCESS_TYPE_LOAD_FILES,
                name: "Load File",
                description: "Loads one xml",
                start: 1000,
                duration: 4000,
                task: { user: "user4", files: ["file.xml"] }
            },
            {
                type: PROCESS_TYPE_MAKE_PAYMENTS,
                name: "Execute Payment",
                description: "Executes a single payment transaction",
                start: 300,
                duration: 1500,
                task: { user: "user2", payments: [{ accountFrom: "accountE", accountTo: "accountF", amount: 0.02 }] }
            },
            {
                type: PROCESS_TYPE_LOAD_FILES,
                name: "Load Two Files",
                description: "Loads two files",
                start: 1800,
                duration: 3200,
                task: { user: "user5", files: ["f1.xml", "f2.xml"] }
            },
            {
                type: PROCESS_TYPE_MAKE_PAYMENTS,
                name: "Batch Payment",
                description: "Processes a batch of payment requests",
                start: 0,
                duration: 5000,
                task: { user: "user1", payments: [{ accountFrom: "accountG", accountTo: "accountH", amount: 0.03 }, { accountFrom: "accountG", accountTo: "accountI", amount: 0.04 }] }
            },
        ];

        let idCtx = 0;
        processes = processes.map(({ ...rest }) => ({
            id: idCtx++,
            ...rest,
            startTime: baseTime.add(rest.start, 'millisecond').format('YYYY-MM-DD HH:mm:ss:SSS'),
            endTime: baseTime.add(rest.start + rest.duration, 'millisecond').format('YYYY-MM-DD HH:mm:ss:SSS'),
        }));

        const calculateStatistics = (type) => {
            const durations = processes.filter(p => p.type === type).map(p => p.duration);
            if (durations.length === 0) return null;

            const sum = durations.reduce((acc, val) => acc + val, 0);
            const mean = sum / durations.length;
            const sorted = [...durations].sort((a, b) => a - b);
            const median = durations.length % 2 === 0
                ? (sorted[durations.length / 2 - 1] + sorted[durations.length / 2]) / 2
                : sorted[Math.floor(durations.length / 2)];
            const variance = durations.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / durations.length;
            const stdDev = Math.sqrt(variance);

            return {
                count: durations.length,
                min: Math.min(...durations),
                max: Math.max(...durations),
                mean: mean,
                median: median,
                stdDev: stdDev,
                totalDuration: sum,
            };
        };

        const loadFilesStats = calculateStatistics(PROCESS_TYPE_LOAD_FILES);
        const makePaymentsStats = calculateStatistics(PROCESS_TYPE_MAKE_PAYMENTS);

        const [showJsonModal, setShowJsonModal] = useState(false);
        const [processJson, setProcessJson] = useState(null);
        const [timelineWidth, setTimelineWidth] = useState(0);

        const maxTimeMs = processes.reduce((max, process) => {
            return Math.max(max, process.start + process.duration);
        }, 0) + 1000;

        const numSeconds = Math.ceil(maxTimeMs / 1000);

        useEffect(() => {
            const updateTimelineWidth = () => {
                if (scrollContainerRef.current) {
                    const containerWidth = scrollContainerRef.current.getBoundingClientRect().width || 1000;
                    const idColumnWidth = 150;
                    setTimelineWidth(containerWidth - idColumnWidth);
                }
            };

            updateTimelineWidth();
            window.addEventListener('resize', updateTimelineWidth);
            return () => window.removeEventListener('resize', updateTimelineWidth);
        }, []);

        const pxPerMs = timelineWidth > 0 ? timelineWidth / maxTimeMs : 0;

        const formatDuration = (ms) => {
            const hours = Math.floor(ms / (1000 * 60 * 60));
            ms %= (1000 * 60 * 60);
            const minutes = Math.floor(ms / (1000 * 60));
            ms %= (1000 * 60);
            const seconds = Math.floor(ms / 1000);
            const milliseconds = ms % 1000;
            return `${hours.toString().padStart(2, '0')}h:${minutes.toString().padStart(2, '0')}m:${seconds.toString().padStart(2, '0')}s:${milliseconds.toString().padStart(3, '0')}ms`;
        };

        const getTimelineColor = (type) => {
            switch(type) {
                case PROCESS_TYPE_LOAD_FILES:
                    return 'bg-green-500';
                case PROCESS_TYPE_MAKE_PAYMENTS:
                    return 'bg-red-500';
                default:
                    return 'bg-gray-500';
            }
        };

        const getTooltipContent = (record) => {
            return (
                <div>
                    <div>Start: {record.startTime}</div>
                    <div>End: {record.endTime}</div>
                    <div>Duration: {formatDuration(record.duration)}</div>
                </div>
            );
        };

        const columns = [
            {
                title: 'Name',
                dataIndex: 'name',
                key: 'name',
                width: 150,
                render: (text, record) => (
                    <span
                        className="process-name"
                        style={{ whiteSpace: "nowrap" }}
                        onClick={() => setProcessJson(record)}
                    >
                        {text}
                    </span>
                ),
            },
            {
                title: 'Timeline',
                dataIndex: 'start',
                key: 'timeline',
                render: (text, record) => (
                    <div className="relative timeline-container w-full">
                        {Array.from({ length: numSeconds }, (_, i) => (
                            <div
                                key={`row-line-${record.name}-${i}`}
                                className="absolute top-0 w-[1px] h-full bg-gray-300"
                                style={{ left: `${i * 1000 * pxPerMs}px` }}
                            />
                        ))}
                        <Tooltip title={getTooltipContent(record)} placement="top">
                            <div
                                className={`absolute timeline-bar rounded ${getTimelineColor(record.type)} cursor-pointer`}
                                style={{
                                    left: `${record.start * pxPerMs}px`,
                                    width: `${record.duration * pxPerMs}px`,
                                }}
                                onClick={() => setProcessJson(record)}
                            />
                        </Tooltip>
                    </div>
                ),
            },
        ];

        return (
            <div className="w-full p-6 bg-white rounded-lg shadow-sm">
                <div className="flex justify-between items-center mb-6">
                    <h3 className="text-xl font-semibold text-center flex-1">Parallel Process Visualization</h3>
                    <button
                        className="text-blue-500 hover:text-blue-700 text-2xl"
                        onClick={() => setShowJsonModal(true)}
                        title="View Processes JSON"
                    >
                        📋
                    </button>
                </div>
                <div ref={scrollContainerRef} className="scroll-container">
                    <Table
                        columns={columns}
                        dataSource={processes}
                        rowKey="name"
                        pagination={false}
                        bordered
                        className="w-full"
                        components={{
                            body: {
                                row: (props) => <tr {...props} className="narrow-row" />,
                            },
                        }}
                    />
                    <div className="ml-[150px] bg-gray-100 border border-t-0 border-gray-200 rounded-b-lg p-2">
                        <div className="flex" style={{ width: `${timelineWidth}px` }}>
                            {Array.from({ length: numSeconds }, (_, i) => (
                                <div
                                    key={`time-label-${i}`}
                                    className="flex-1 min-w-[40px] text-center text-xs text-gray-600 py-1 border-r border-gray-200 last:border-r-0"
                                    style={{ width: `${1000 * pxPerMs}px` }}
                                >
                                    {`${i}s`}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
                <Modal
                    title="Processes JSON"
                    open={showJsonModal}
                    onCancel={() => setShowJsonModal(false)}
                    footer={null}
                    width={800}
                >
                    <pre className="bg-gray-100 p-4 rounded overflow-x-auto text-sm">
                        {JSON.stringify(processes, null, 2)}
                    </pre>
                </Modal>
                <Modal
                    title={processJson ? processJson.name : "Process Details"}
                    open={!!processJson}
                    onCancel={() => setProcessJson(null)}
                    footer={null}
                    width={600}
                >
                    <pre className="bg-gray-100 p-4 rounded overflow-x-auto text-sm">
                        {processJson ? JSON.stringify(processJson, null, 2) : ''}
                    </pre>
                </Modal>
                <div className="mt-6">
                    <h4 className="text-lg font-bold mb-2">Statistics</h4>
                    <div className="space-y-2">
                        <div>
                            <h5 className="font-semibold">Load Files</h5>
                            <pre>{loadFilesStats ? JSON.stringify(loadFilesStats, null, 2) : 'No data'}</pre>
                        </div>
                        <div>
                            <h5 className="font-semibold">Make Payments</h5>
                            <pre>{makePaymentsStats ? JSON.stringify(makePaymentsStats, null, 2) : 'No data'}</pre>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
