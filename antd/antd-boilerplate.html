<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React with Ant Design</title>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/antd/5.27.5/reset.css" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/antd/5.27.4/antd.min.js"></script>

</head>
<body>

<div id="root"></div>

<script type="text/babel">
    function App() {
        const { useState } = React;
        const { Table } = antd;

        const users = [
            { "user": "user1", "private": true, "key": "user1" },
            { "user": "user2", "private": true, "key": "user2" },
            { "user": "user3", "private": true, "key": "user3" }
        ];

        const [data] = useState(users);

        const columns = [
            { title: 'User', dataIndex: 'user', key: 'user' },
            { title: 'Private', dataIndex: 'private', key: 'private' }
        ];

        return <Table
            columns={columns}
            dataSource={data}
            rowKey="key"
            pagination={false}
        />
    }

    const { createRoot } = ReactDOM;
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
