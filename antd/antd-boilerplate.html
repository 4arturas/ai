<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React with Ant Design</title>
    <link rel="stylesheet" href="https://unpkg.com/antd@6.4.4/dist/antd.css" />
    <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
</head>
<body>

<div id="root"></div>

<script type="module">
    import React from "https://esm.sh/react@19?dev";
    import { createRoot } from "https://esm.sh/react-dom@19/client?dev";
    import { Table } from "https://esm.sh/antd@6.4.4?dev&bundle";

    globalThis.React = React;
    globalThis.ReactDOM = { createRoot };
    globalThis.antd = { Table };
</script>

<script type="text/babel">
    function App() {
        const { useState } = React;
        const { Table } = antd;

        const users = [
            { "user": "user1", "private": true, "key": "user1" },
            { "user": "user2", "private": true, "key": "user2" },
            { "user": "user3", "private": true, "key": "user3" }
        ];

        const [data] = useState(users);

        const columns = [
            { title: 'User', dataIndex: 'user', key: 'user' },
            { title: 'Private', dataIndex: 'private', key: 'private' }
        ];

        return <Table
            columns={columns}
            dataSource={data}
            rowKey="key"
            pagination={false}
        />
    }

    const { createRoot } = ReactDOM;
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
