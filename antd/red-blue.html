<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React with Ant Design</title>
    <link rel="stylesheet" href="https://unpkg.com/antd@6.4.4/dist/antd.css" />
    <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
    <style>
        body, html, #root {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: sans-serif;
        }

        .main-container {
            height: 100vh;
            width: 100%;
            padding: 1rem;
        }

        .flex-center-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90vh;
            width: 100%;
            padding: 1rem;
            font-family: sans-serif;
        }

        .flex-center-row {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .color-circle {
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
            border: 2px solid #ccc;
        }

        .color-circle:hover {
            transform: scale(1.05);
        }

        canvas {
            display: block;
            margin: auto;
            border: 1px solid #ddd;
            background-color: #fff;
        }

        .slider-container {
            width: 50%;
            margin-bottom: 2rem;
            vertical-align: top;
        }

        .slider-title {
            font-size: 1.125rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .circles-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10rem;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="module">
    import React from "https://esm.sh/react@19?dev";
    import { createRoot } from "https://esm.sh/react-dom@19/client?dev";
    import { ColorPicker, Popover, Slider, Tabs, theme } from "https://esm.sh/antd@6.4.4?dev&bundle";

    globalThis.React = React;
    globalThis.ReactDOM = { createRoot };
    globalThis.antd = { ColorPicker, Popover, Slider, Tabs, theme };
</script>

<script type="text/babel">
    const { ColorPicker, Popover, theme, Tabs, Slider } = antd;
    const { useState, useMemo, useEffect, useRef } = React;
    const { useToken } = theme;

    function ColorCircles() {
        const [leftColor, setLeftColor] = useState('#ff0000');
        const [rightColor, setRightColor] = useState('#0000ff');
        const [circleSize, setCircleSize] = useState(180);
        const { token } = useToken();

        const circleCommonStyle = useMemo(() => ({
            width: circleSize + 'px',
            height: circleSize + 'px',
        }), [circleSize]);

        const leftCircleStyle = useMemo(() => ({
            ...circleCommonStyle,
            backgroundColor: leftColor,
        }), [leftColor, circleCommonStyle]);

        const rightCircleStyle = useMemo(() => ({
            ...circleCommonStyle,
            backgroundColor: rightColor,
        }), [rightColor, circleCommonStyle]);

        return (
            <div className="flex-center-col">
                <div className="slider-container">
                    <h3 className="slider-title">Adjust Circle Size</h3>
                    <Slider
                        min={50}
                        max={300}
                        step={1}
                        value={circleSize}
                        onChange={setCircleSize}
                        tooltip={{ formatter: (value) => `${value}px` }}
                    />
                </div>
                <div className="circles-wrapper">
                    <Popover
                        content={
                            <ColorPicker
                                value={leftColor}
                                onChange={(color, hex) => setLeftColor(hex)}
                                showText
                            />
                        }
                        trigger="click"
                        placement="right"
                    >
                        <div
                            className="color-circle"
                            style={leftCircleStyle}
                        >
                        </div>
                    </Popover>

                    <Popover
                        content={
                            <ColorPicker
                                value={rightColor}
                                onChange={(color, hex) => setRightColor(hex)}
                                showText
                            />
                        }
                        trigger="click"
                        placement="left"
                    >
                        <div
                            className="color-circle"
                            style={rightCircleStyle}
                        >
                        </div>
                    </Popover>
                </div>
                <div style={{height:"400px"}}>&nbsp;</div>
            </div>
        );
    }

    function NeckerCube() {
        const canvasRef = useRef(null);

        useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let animationFrameId;
            let perception = true;

            const drawCube = () => {
                const size = 150;
                const offset = size / 3;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;

                const frontSquare = [
                    { x: centerX - size / 2, y: centerY - size / 2 },
                    { x: centerX + size / 2, y: centerY - size / 2 },
                    { x: centerX + size / 2, y: centerY + size / 2 },
                    { x: centerX - size / 2, y: centerY + size / 2 }
                ];

                const backSquare = [
                    { x: centerX - size / 2 + offset, y: centerY - size / 2 + offset },
                    { x: centerX + size / 2 + offset, y: centerY - size / 2 + offset },
                    { x: centerX + size / 2 + offset, y: centerY + size / 2 + offset },
                    { x: centerX - size / 2 + offset, y: centerY + size / 2 + offset }
                ];

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;

                const drawSquare = (square) => {
                    ctx.beginPath();
                    ctx.moveTo(square[0].x, square[0].y);
                    ctx.lineTo(square[1].x, square[1].y);
                    ctx.lineTo(square[2].x, square[2].y);
                    ctx.lineTo(square[3].x, square[3].y);
                    ctx.closePath();
                    ctx.stroke();
                };

                const drawConnectingLines = (s1, s2) => {
                    for (let i = 0; i < 4; i++) {
                        ctx.beginPath();
                        ctx.moveTo(s1[i].x, s1[i].y);
                        ctx.lineTo(s2[i].x, s2[i].y);
                        ctx.stroke();
                    }
                };

                if (perception) {
                    drawSquare(backSquare);
                    drawSquare(frontSquare);
                } else {
                    drawSquare(frontSquare);
                    drawSquare(backSquare);
                }
                drawConnectingLines(frontSquare, backSquare);
            };

            const animateCube = () => {
                drawCube();
                animationFrameId = requestAnimationFrame(animateCube);
            };

            const togglePerception = () => {
                perception = !perception;
                drawCube();
            };

            const intervalId = setInterval(togglePerception, 2000);

            animateCube();

            return () => {
                cancelAnimationFrame(animationFrameId);
                clearInterval(intervalId);
            };
        }, []);

        return (
            <div className="flex-center-col">
                <canvas ref={canvasRef} width="400" height="400"></canvas>
            </div>
        );
    }

    function App() {
        const items = [
            {
                key: '1',
                label: 'Color Circles',
                children: <ColorCircles />,
            },
            {
                key: '2',
                label: 'Necker Cube',
                children: <NeckerCube />,
            },
        ];

        return (
            <div className="main-container">
                <Tabs defaultActiveKey="1" items={items} centered size="large"/>
            </div>
        );
    }

    const { createRoot } = ReactDOM;
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
