<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React with Ant Design - Full-Screen Tabs</title>
    <link href="https://unpkg.com/antd@6.4.4/dist/antd.css" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <script type="module">
        import React from "https://esm.sh/react@19?dev";
        import { createRoot } from "https://esm.sh/react-dom@19/client?dev";
        import { Button, Tabs } from "https://esm.sh/antd@6.4.4?dev&bundle";

        globalThis.React = React;
        globalThis.ReactDOM = { createRoot };
        globalThis.antd = { Button, Tabs };
    </script>

    <script type="text/babel" src="components/Context.js"></script>
    <script type="text/babel" src="components/Counter.js"></script>
    <script type="text/babel" src="components/D3Chart.js"></script>
    <script type="text/babel" src="components/ForceDirectedGraph.js"></script>
    <script type="text/babel" src="components/SOM.js"></script>

    <style>
        body { padding: 30px }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { Tabs } = antd;
    function App()
    {
        const [appContext, setAppContext] = React.useState(
            {activeTabKey: "5"}
        );
        const tabItems = [
            { key: "1", label: "Expandable Table", children: <div>Hello</div> },
            { key: "2", label: "Counter", children: <Counter/> },
            { key: "3", label: "D3Chart", children: <D3Chart/> },
            { key: "4", label: "ForceDirectedGraph", children: <ForceDirectedGraph/> },
            { key: "5", label: "SOM", children: <SOM/> },
        ];
        return (
            <div>
                <AppContext.Provider value={{ appContext, setAppContext }}>
                    <Tabs
                        activeKey={appContext.activeTabKey}
                        items={tabItems}
                        onChange={(key) => {
                            setAppContext( { ...appContext, activeTabKey: key } );
                        }}
                    />
                </AppContext.Provider>
            </div>
        );
    }
    const { createRoot } = ReactDOM;
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
