<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style> body { margin: 0; } </style>
</head>
<body>
<script>
    // PID constants (using original values that worked well)
    const params = {
        kp: 0.04,    // Proportional - original value
        ki: 0.002,   // Integral - original value
        kd: 0.15,    // Derivative - original value
        maxForce: 0.8,
        damping: 0.95,
        integralLimit: 200
    };

    // Initial state with proper PID tracking
    let state = {
        pos: { x: 0, y: 0 },
        vel: { x: 0, y: 0 },
        acc: { x: 0, y: 0 },
        error: { x: 0, y: 0 },
        prevError: { x: 0, y: 0 },
        integral: { x: 0, y: 0 }
    };

    function setup() {
        createCanvas(windowWidth, windowHeight);
        state.pos = { x: width/2, y: height/2 };
        colorMode(HSB, 360, 100, 100);
    }

    function draw() {
        // Animated background like original
        background((frameCount * 0.5) % 360, 90, 90);

        // Target is mouse position
        const target = { x: mouseX, y: mouseY };

        // Update PID for both x and y axes
        ['x', 'y'].forEach(axis => {
            // Calculate PID components
            const currentError = target[axis] - state.pos[axis];
            const accumulatedIntegral = constrain(
                state.integral[axis] + currentError,
                -params.integralLimit,
                params.integralLimit
            );
            const errorDerivative = currentError - state.prevError[axis];

            // Calculate total PID output force
            const pidForce =
                params.kp * currentError +           // Proportional term
                params.ki * accumulatedIntegral +    // Integral term
                params.kd * errorDerivative;         // Derivative term

            // Update state with new values
            state.error[axis] = currentError;
            state.integral[axis] = accumulatedIntegral;

            // Apply physics
            state.acc[axis] = constrain(pidForce, -params.maxForce, params.maxForce);
            state.vel[axis] = (state.vel[axis] + state.acc[axis]) * params.damping;
            state.pos[axis] += state.vel[axis];
            state.prevError[axis] = currentError;
        });

        // Draw target (red circle)
        fill(0, 80, 100);
        noStroke();
        ellipse(target.x, target.y, 20, 20);

        // Draw mover (cyan circle like original)
        stroke(0, 0, 100);
        fill(180, 80, 80);
        ellipse(state.pos.x, state.pos.y, 30, 30);
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>
</body>
</html>
