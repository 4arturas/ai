<!DOCTYPE html>
<html>
<head>
    <title>PID Follower</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            background-color: #222;
        }
        #target {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #f00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2; /* Higher z-index to appear on top */
        }
        #follower {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: hsl(120, 80%, 50%);
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 1; /* Lower z-index to appear behind */
        }
    </style>
</head>
<body>
<div id="follower"></div> <!-- Follower first in DOM -->
<div id="target"></div>   <!-- Target second in DOM -->

<script>
    // PID Constants
    const PID = {
        kp: 0.04,    // Proportional gain
        ki: 0.002,   // Integral gain
        kd: 0.15,    // Derivative gain
        maxForce: 0.8,
        damping: 0.95,
        integralLimit: 200
    };

    // Elements
    const target = document.getElementById('target');
    const follower = document.getElementById('follower');

    // State
    const state = {
        pos: { x: window.innerWidth/2, y: window.innerHeight/2 },
        vel: { x: 0, y: 0 },
        error: { x: 0, y: 0 },
        prevError: { x: 0, y: 0 },
        integral: { x: 0, y: 0 }
    };

    // Mouse position
    const mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };

    // Initialize positions
    function init() {
        target.style.left = `${mouse.x}px`;
        target.style.top = `${mouse.y}px`;
        follower.style.left = `${state.pos.x}px`;
        follower.style.top = `${state.pos.y}px`;
        animate();
    }

    // Animation loop
    function animate() {
        updatePID();
        updateElements();
        requestAnimationFrame(animate);
    }

    // Update PID controller
    function updatePID() {
        ['x', 'y'].forEach(axis => {
            // Calculate error terms
            state.error[axis] = mouse[axis] - state.pos[axis];
            state.integral[axis] = constrain(
                state.integral[axis] + state.error[axis],
                -PID.integralLimit,
                PID.integralLimit
            );
            const derivative = state.error[axis] - state.prevError[axis];

            // Calculate output
            const output = PID.kp * state.error[axis] +
                PID.ki * state.integral[axis] +
                PID.kd * derivative;

            // Update physics
            state.vel[axis] = (state.vel[axis] + constrain(output, -PID.maxForce, PID.maxForce)) * PID.damping;
            state.pos[axis] += state.vel[axis];
            state.prevError[axis] = state.error[axis];
        });
    }

    // Constrain helper function
    function constrain(value, min, max) {
        return Math.min(Math.max(value, min), max);
    }

    // Update DOM elements
    function updateElements() {
        follower.style.left = `${state.pos.x}px`;
        follower.style.top = `${state.pos.y}px`;
    }

    // Track mouse movement
    document.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        target.style.left = `${mouse.x}px`;
        target.style.top = `${mouse.y}px`;
    });

    // Handle window resize
    window.addEventListener('resize', () => {
        // If mouse hasn't moved, keep it centered
        if (mouse.x === window.innerWidth/2 && mouse.y === window.innerHeight/2) {
            mouse.x = window.innerWidth/2;
            mouse.y = window.innerHeight/2;
        }
    });

    // Start the animation
    init();
</script>
</body>
</html>
