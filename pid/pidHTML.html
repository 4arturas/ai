<!DOCTYPE html>
<html>
<head>
    <title>PID Follower (Reworked)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            background-color: #222;
        }
        #target {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #f00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        #follower {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: hsl(120, 80%, 50%);
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
    </style>
</head>
<body>
<div id="follower"></div>
<div id="target"></div>

<script>
    const PID_CONTROLLER_PARAMS = {
        kp: 0.04,
        ki: 0.002,
        kd: 0.15,
        maxForce: 0.8,
        damping: 0.95,
        integralLimit: 200
    };

    const PLANT_STATE = {
        pos: { x: window.innerWidth / 2, y: window.innerHeight / 2 },
        vel: { x: 0, y: 0 },
        integral: { x: 0, y: 0 },
        prevError: { x: 0, y: 0 }
    };

    const INPUT_TARGET_POSITION = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

    const targetElement = document.getElementById('target');
    const followerElement = document.getElementById('follower');

    function constrain(value, min, max) {
        return Math.min(Math.max(value, min), max);
    }

    function initializeSimulation() {
        targetElement.style.left = `${INPUT_TARGET_POSITION.x}px`;
        targetElement.style.top = `${INPUT_TARGET_POSITION.y}px`;
        followerElement.style.left = `${PLANT_STATE.pos.x}px`;
        followerElement.style.top = `${PLANT_STATE.pos.y}px`;
        animateLoop();
    }

    function animateLoop() {
        ['x', 'y'].forEach(axis => {
            const currentError = INPUT_TARGET_POSITION[axis] - PLANT_STATE.pos[axis];

            PLANT_STATE.integral[axis] = constrain(
                PLANT_STATE.integral[axis] + currentError,
                -PID_CONTROLLER_PARAMS.integralLimit,
                PID_CONTROLLER_PARAMS.integralLimit
            );

            const derivativeError = currentError - PLANT_STATE.prevError[axis];

            const pidOutput =
                (PID_CONTROLLER_PARAMS.kp * currentError) +
                (PID_CONTROLLER_PARAMS.ki * PLANT_STATE.integral[axis]) +
                (PID_CONTROLLER_PARAMS.kd * derivativeError);

            PLANT_STATE.prevError[axis] = currentError;

            PLANT_STATE.vel[axis] =
                (PLANT_STATE.vel[axis] + constrain(pidOutput, -PID_CONTROLLER_PARAMS.maxForce, PID_CONTROLLER_PARAMS.maxForce)) *
                PID_CONTROLLER_PARAMS.damping;

            PLANT_STATE.pos[axis] += PLANT_STATE.vel[axis];
        });

        followerElement.style.left = `${PLANT_STATE.pos.x}px`;
        followerElement.style.top = `${PLANT_STATE.pos.y}px`;

        requestAnimationFrame(animateLoop);
    }

    document.addEventListener('mousemove', (e) => {
        INPUT_TARGET_POSITION.x = e.clientX;
        INPUT_TARGET_POSITION.y = e.clientY;
        targetElement.style.left = `${INPUT_TARGET_POSITION.x}px`;
        targetElement.style.top = `${INPUT_TARGET_POSITION.y}px`;
    });

    window.addEventListener('resize', () => {
        if (INPUT_TARGET_POSITION.x === window.innerWidth/2 && INPUT_TARGET_POSITION.y === window.innerHeight/2) {
            INPUT_TARGET_POSITION.x = window.innerWidth/2;
            INPUT_TARGET_POSITION.y = window.innerHeight/2;
        }
    });

    initializeSimulation();
</script>
</body>
</html>
