<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logika: Silogizmai ir Teiginių Kvadratas</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #f9f9f9;
        }

        /* Koordinačių sistemos / Kvadrato stiliai */
        .logic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .square-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            border: 2px solid #333;
            margin: 40px;
        }

        .point {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #fff;
            border: 3px solid #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            z-index: 2;
        }

        /* Taškų pozicijos */
        .point.A { top: -20px; left: -20px; color: blue; border-color: blue; }
        .point.E { top: -20px; right: -20px; color: red; border-color: red; }
        .point.I { bottom: -20px; left: -20px; color: green; border-color: green; }
        .point.O { bottom: -20px; right: -20px; color: orange; border-color: orange; }

        .label {
            position: absolute;
            font-size: 12px;
            font-style: italic;
            color: #666;
            text-align: center;
        }

        .label.top { top: -45px; width: 100%; left: 0; }
        .label.bottom { bottom: -45px; width: 100%; left: 0; }
        .label.left { transform: rotate(-90deg); left: -85px; top: 140px; width: 150px; }
        .label.right { transform: rotate(90deg); right: -85px; top: 140px; width: 150px; }
        .label.diag { color: #999; }

        /* Įstrižainės per SVG */
        .diagonals {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Lentelės stiliai */
        table { border-collapse: collapse; margin-top: 20px; }
        .quantity { color: blue; font-weight: bold; }
        .subject { color: green; font-weight: bold; }
        .predicate { color: red; font-weight: bold; }

        td {
            padding: 10px;
            border: 1px solid #eee;
            background: white;
        }

        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="logic-container">
    <h2>Logikos kvadratas (Oppositio)</h2>
    <div class="square-wrapper">
        <svg class="diagonals">
            <line x1="0" y1="0" x2="300" y2="300" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5" />
            <line x1="300" y1="0" x2="0" y2="300" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5" />
        </svg>

        <!-- Taškai -->
        <div class="point A" title="Visi S yra P">A</div>
        <div class="point E" title="Nė vienas S nėra P">E</div>
        <div class="point I" title="Kai kurie S yra P">I</div>
        <div class="point O" title="Kai kurie S nėra P">O</div>

        <!-- Ryšių pavadinimai -->
        <div class="label top">Priešingumas (Kontrariškumas)</div>
        <div class="label bottom">Priešpriešingumas (Subkontrariškumas)</div>
        <div class="label left">Pavaldumas</div>
        <div class="label right">Pavaldumas</div>
        <div class="label diag" style="top: 130px; left: 95px; transform: rotate(45deg);">Prieštaravimas</div>
        <div class="label diag" style="top: 130px; right: 95px; transform: rotate(-45deg);">Prieštaravimas</div>
    </div>
    <p style="max-width: 500px; text-align: center; color: #555;">
        <span style="color:blue">A</span>: Visi... | <span style="color:red">E</span>: Nė vienas... | <span style="color:green">I</span>: Kai kurie yra... | <span style="color:orange">O</span>: Kai kurie nėra...
    </p>
</div>

<h2>Silogizmų figūros</h2>
<table id="tbody"></table>

<script>
    function create_Sylogism(title, a, b, c) {
        const replaceTerms = (txt) => {
            let replacedTxt = txt;

            // 1. Kiekybės žodžiai
            const quantities = ['Visi', 'Visos', 'Nė viena', 'Nė vienas', 'Kai kurie', 'Kai kurios'];
            quantities.forEach(q => {
                const reg = new RegExp(q, 'g');
                replacedTxt = replacedTxt.replace(reg, `<span class="quantity">${q}</span>`);
            });

            // 2. Subjektų ir predikatų žemėlapis (supaprastintas derinimas)
            const terms = [
                { s: 'gyvūnai', p: 'mirtingi' },
                { s: 'žmonės', p: 'mirtingi' },
                { s: 'žmonės', p: 'gyvūnai' },
                { s: 'roplė', p: 'kailio' },
                { s: 'gyvatės', p: 'roplės' },
                { s: 'gyvatė', p: 'kailio' },
                { s: 'kačiukai', p: 'žaismingi' },
                { s: 'naminiai gyvūnai', p: 'kačiukai' },
                { s: 'naminiai gyvūnai', p: 'žaismingi' },
                { s: 'namų darbas', p: 'linksmas' },
                { s: 'skaitymai', p: 'namų darbai' },
                { s: 'skaitymai', p: 'linksmi' },
                { s: 'gyvatės', p: 'kailio' },
                { s: 'sveikas maistas', p: 'nestorina' },
                { s: 'tortai', p: 'storina' },
                { s: 'tortas', p: 'sveikas maistas' },
                { s: 'arkliai', p: 'pilvo pūtimą' },
                { s: 'žmogus', p: 'pilvo pūtimo' },
                { s: 'žmogus', p: 'arklys' },
                { s: 'tinginys', p: 'egzaminų' },
                { s: 'studentai', p: 'egzaminus' },
                { s: 'studentai', p: 'tinginiai' },
                { s: 'informatyvūs dalykai', p: 'naudingi' },
                { s: 'svetainės', p: 'naudingos' },
                { s: 'svetainės', p: 'informatyvios' },
                { s: 'tortai', p: 'sveikas maistas' },
                { s: 'žmonės', p: 'arkliai' },
                { s: 'vaisiai', p: 'maistingi' },
                { s: 'vaisiai', p: 'skanūs' },
                { s: 'skanūs produktai', p: 'maistingi' },
                { s: 'puodeliai', p: 'gražūs' },
                { s: 'puodeliai', p: 'naudingi' },
                { s: 'naudingi dalykai', p: 'gražūs' },
                { s: 'stropūs berniukai šioje mokykloje', p: 'raudoni' },
                { s: 'stropūs berniukai šioje mokykloje', p: 'internato mokiniai' },
                { s: 'internato mokiniai šioje mokykloje', p: 'raudoni' },
                { s: 'ąsotis šioje spintoje', p: 'naujas' },
                { s: 'ąsočiai šioje spintoje', p: 'įskilę' },
                { s: 'įskilę daiktai šioje spintoje', p: 'nauji' },
                { s: 'katės', p: 'uodegos' },
                { s: 'katės', p: 'žinduoliai' },
                { s: 'žinduoliai', p: 'uodegos' },
                { s: 'medis', p: 'valgomas' },
                { s: 'medžiai', p: 'žali' },
                { s: 'žali daiktai', p: 'valgomi' },
                { s: 'obuoliai mano sode', p: 'naudingi' },
                { s: 'naudingi vaisiai', p: 'sunokę' },
                { s: 'sunokę vaisiai', p: 'obuoliai mano sode' },
                { s: 'ryškios gėlės', p: 'kvapnios' },
                { s: 'kvapni gėlė', p: 'auginama patalpoje' },
                { s: 'auginama patalpoje gėlė', p: 'ryški' },
                { s: 'maži paukščiai', p: 'medumi' },
                { s: 'medumi mintantys paukščiai', p: 'spalvoti' },
                { s: 'spalvoti paukščiai', p: 'maži' },
                { s: 'žmogus', p: 'tobulas' },
                { s: 'tobulos būtybės', p: 'mitinės' },
                { s: 'mitinės būtybės', p: 'žmonės' },
                { s: 'kompetentingas žmogus', p: 'neklysta' },
                { s: 'klystantys žmonės', p: 'dirba čia' },
                { s: 'dirbantys žmonės', p: 'nekompetentingi' },
                { s: 'patalpoje auginamos gėlės', p: 'ryškios' }
            ];

            terms.forEach(term => {
                if (replacedTxt.includes(term.s) && replacedTxt.includes(term.p)) {
                    replacedTxt = replacedTxt.replace(term.s, `<span class="subject">${term.s}</span>`);
                    replacedTxt = replacedTxt.replace(term.p, `<span class="predicate">${term.p}</span>`);
                }
            });

            return replacedTxt;
        };

        const create_Div = (v, isTitle = false, isConcl = false) => {
            const div = document.createElement('div');
            div.style.whiteSpace = 'nowrap';
            if (isTitle) div.style.fontWeight = 'bold';
            if (isConcl) {
                div.style.borderTop = '1px solid black';
                div.style.marginBottom = '15px';
            }
            div.innerHTML = replaceTerms(v);
            return div;
        };

        const td = document.createElement('td');
        td.style.verticalAlign = 'top';
        td.appendChild(create_Div(title, true));
        td.appendChild(create_Div(a));
        td.appendChild(create_Div(b));
        td.appendChild(create_Div(c, false, true));
        return td;
    }

    function init() {
        const tbody = document.getElementById('tbody');
        const rows = [];
        for(let i=0; i<6; i++) {
            const tr = document.createElement('tr');
            tbody.appendChild(tr);
            rows.push(tr);
        }

        // Duomenų masyvas patogesniam užpildymui
        const data = [
            [0, 'bArbArA', 'Visi gyvūnai mirtingi.', 'Visi žmonės yra gyvūnai.', 'Visi žmonės mirtingi.'],
            [1, 'cElArEnt', 'Nė viena roplė neturi kailio.', 'Visos gyvatės yra roplės.', 'Nė viena gyvatė neturi kailio.'],
            [2, 'dArII', 'Visi kačiukai yra žaismingi.', 'Kai kurie naminiai gyvūnai yra kačiukai.', 'Kai kurie naminiai gyvūnai yra žaismingi.'],
            [3, 'fErIO', 'Nė vienas namų darbas nėra linksmas.', 'Kai kurie skaitymai yra namų darbai.', 'Kai kurie skaitymai nėra linksmi.'],
            [4, 'bArbArI', 'Visi gyvūnai mirtingi.', 'Visi žmonės yra gyvūnai.', 'Kai kurie žmonės mirtingi.'],
            [5, 'cElArOnt', 'Nė viena roplė neturi kailio.', 'Visos gyvatės yra roplės.', 'Kai kurios gyvatės neturi kailio.'],

            [0, 'cEsArE', 'Nė vienas sveikas maistas nestorina.', 'Visi tortai storina.', 'Nė vienas tortas nėra sveikas maistas.'],
            [1, 'cAmEstrEs', 'Visi arkliai turi pilvo pūtimą.', 'Nė vienas žmogus neturi pilvo pūtimo.', 'Nė vienas žmogus nėra arklys.'],
            [2, 'fEstInO', 'Nė vienas tinginys neišlaiko egzaminų.', 'Kai kurie studentai išlaiko egzaminus.', 'Kai kurie studentai nėra tinginiai.'],
            [3, 'bArOcO', 'Visi informatyvūs dalykai yra naudingi.', 'Kai kurios svetainės nėra naudingos.', 'Kai kurios svetainės nėra informatyvios.'],
            [4, 'cEsArO', 'Nė vienas sveikas maistas nestorina.', 'Visi tortai storina.', 'Kai kurie tortai nėra sveikas maistas.'],
            [5, 'cAmEstrOs', 'Visi arkliai turi pilvo pūtimą.', 'Nė vienas žmogus neturi pilvo pūtimo.', 'Kai kurie žmonės nėra arkliai.'],

            [0, 'dArAptI', 'Visi vaisiai yra maistingi.', 'Visi vaisiai yra skanūs.', 'Kai kurie skanūs produktai yra maistingi.'],
            [1, 'dIsAmIs', 'Kai kurie puodeliai yra gražūs.', 'Visi puodeliai yra naudingi.', 'Kai kurie naudingi dalykai yra gražūs.'],
            [2, 'dAtIsI', 'Visi stropūs berniukai šioje mokykloje yra raudoni.', 'Kai kurie stropūs berniukai šioje mokykloje yra internato mokiniai.', 'Kai kurie internato mokiniai šioje mokykloje yra raudoni.'],
            [3, 'fElAptOn', 'Nė vienas ąsotis šioje spintoje nėra naujas.', 'Visi ąsočiai šioje spintoje yra įskilę.', 'Kai kurie įskilę daiktai šioje spintoje nėra nauji.'],
            [4, 'bAcArdO', 'Kai kurios katės neturi uodegos.', 'Visos katės yra žinduoliai.', 'Kai kurie žinduoliai neturi uodegos.'],
            [5, 'fErIsOn', 'Nė vienas medis nėra valgomas.', 'Kai kurie medžiai yra žali.', 'Kai kurie žali daiktai nėra valgomi.'],

            [0, 'brAmAntIp', 'Visi obuoliai mano sode yra naudingi.', 'Visi naudingi vaisiai yra sunokę.', 'Kai kurie sunokę vaisiai yra obuoliai mano sode.'],
            [1, 'cAmEnEs', 'Visos ryškios gėlės yra kvapnios.', 'Nė viena kvapni gėlė nėra auginama patalpoje.', 'Nė viena patalpoje auginama gėlė nėra ryški.'],
            [2, 'dImArIs', 'Kai kurie maži paukščiai minta medumi.', 'Visi medumi mintantys paukščiai yra spalvoti.', 'Kai kurie spalvoti paukščiai yra maži.'],
            [3, 'fEsApO', 'Nė vienas žmogus nėra tobulas.', 'Visos tobulos būtybės yra mitinės.', 'Kai kurios mitinės būtybės nėra žmonės.'],
            [4, 'frEsIsOn', 'Nė vienas kompetentingas žmogus neklysta.', 'Kai kurie klystantys žmonės dirba čia.', 'Kai kurie čia dirbantys žmonės yra nekompetentingi.'],
            [5, 'cAmEnOs', 'Visos ryškios gėlės yra kvapnios.', 'Nė viena kvapni gėlė nėra auginama patalpoje.', 'Kai kurios patalpoje auginamos gėlės nėra ryškios.']
        ];

        data.forEach(item => {
            rows[item[0]].appendChild(create_Sylogism(item[1], item[2], item[3], item[4]));
        });
    }

    init();
</script>

</body>
</html>
